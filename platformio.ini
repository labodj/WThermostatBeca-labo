; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = WThermostat
build_dir = .pioenvs
build_cache_dir = .pio/cache
extra_configs = platformio_override.ini
default_envs = wthermostat

[common]
# appversion is just devel, during github-actions its set to branch-date-hash or tagname by platformio_override.ini 
# you can set your own in your local platformio_override.ini (see platformio_override.sample.ini)
appversion = 1.25.0-labo.5
framework = arduino
board = esp01_1m
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m.ld
platform = https://github.com/platformio/platform-espressif8266.git#668c2a2e4f16bd83b6c812f1ee0605c62b3ce2d2
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#1475ed7d49fef5c5167061ac76abb6eced9abda5
    # Core-recommended GCC 10.3 bugfix revision; Linux x86_64 development/CI.
    platformio/toolchain-xtensa @ https://github.com/earlephilhower/esp-quick-toolchain/releases/download/3.2.0-gcc10.3/x86_64-linux-gnu.xtensa-lx106-elf-c791b74.230224.tar.gz
    platformio/tool-clangtidy @ 1.190100.0
    platformio/tool-esptoolpy @ 2.41100.260830
build_flags = 
	-mtarget-align
	-DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-DVTABLES_IN_FLASH
	-DFP_IN_IROM
	-Os
	-fno-exceptions
	-fno-caller-saves
	-fno-devirtualize
	-fmerge-all-constants
	-finline-functions
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wl,-relax
	-Wl,-Map,firmware.map
	-DMIMETYPE_MINIMAL
	-Wall
	-DNDEBUG
	-DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
build_unflags = 
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
monitor_speed = 9600
upload_speed = 115200
upload_resetmethod = nodemcu
upload_port =
extra_scripts = ${scripts_defaults.extra_scripts}
lib_deps = 
	ESP8266WiFi
	esp32async/ESPAsyncTCP@2.0.0
	esp32async/ESPAsyncWebServer@3.12.1
	ESP8266mDNS
	DNSServer
	EEPROM
	paulstoffregen/Time@1.6.1
	NTPClient@3.2.1
	Hash

check_tool = 
	clangtidy
	#cppcheck
check_src_filters = +<WThermostat/*.cpp>
# Use python pio/check.py to also validate parser success.
check_flags =
    clangtidy: --checks=-*,clang-analyzer-*,bugprone-*,performance-* --header-filter=(WThermostat|lib/WAdapter)/.* --extra-arg-before=-xc++ --extra-arg=-std=gnu++17 --extra-arg=-m32 --extra-arg=-funsigned-char --extra-arg=-fshort-wchar
check_severity = low, medium, high

[scripts_defaults]
extra_scripts = 
	pio/strip-floats.py
	pio/name-firmware.py


[env]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
framework = ${common.framework}
board = ${common.board}
board_build.ldscript = ${common.board_build.ldscript}
board_build.flash_mode = ${common.board_build.flash_mode}
board_build.f_cpu = ${common.board_build.f_cpu}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
	-DVERSION='"${common.appversion}"'
monitor_speed = ${common.monitor_speed}
upload_port = ${common.upload_port}
upload_resetmethod = ${common.upload_resetmethod}
upload_speed = ${common.upload_speed}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
check_tool = ${common.check_tool}
check_src_filters = ${common.check_src_filters}
check_flags = ${common.check_flags}
check_severity = ${common.check_severity}


# this is the default production env
[env:wthermostat]
build_type = release
build_flags = ${env.build_flags}
upload_protocol = custom
upload_command = python pio/espupload.py -u $UPLOAD_PORT -f $SOURCE
lib_deps = ${env.lib_deps}

# this is the minimal version. No MQTT and no Thermostat Support.
# meant for OTA Upgrading when standard is too small.
# After flashing minimal do an upgrade to normal
[env:wthermostat-minimal]
build_type = release
build_flags = ${env.build_flags}
	-D NDEBUG -D MINIMAL
lib_deps = ${common.lib_deps}

# this is the debug version
# do NOT install to real thermostat hardware
# it's meant for flashing to nodemcu for development/testing
[env:wthermostat-debug]
board = nodemcuv2
build_type = debug
monitor_speed = 115200
upload_speed = 921600
build_flags = ${env.build_flags} -DDEBUG
lib_deps = ${env.lib_deps}

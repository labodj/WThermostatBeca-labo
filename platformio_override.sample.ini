#
# Save  this file as 'platformio_override.ini' and 
# do here your custom settings
#


[platformio]
# what targets to build
default_envs = 
    wthermostat
#    wthermostat-minimal
#    wthermostat-debug

[common]
# define here the name of your fw
appversion = devel-xyz
# Upload-Speed an COM-Port
monitor_speed = 9600
upload_speed = 115200
upload_port = 192.0.2.1

[env:wthermostat]
# upload OTA to destination-device for non-debug build
# if commented out then the settings from [common] section (COM-Upload) will be used
# Normal firmware uses OTA; set upload_port to the device IP/hostname above.
# The uploader prompts for admin and the configured WiFi password.
# For debug USB upload, override upload_port under env:wthermostat-debug.
# upload_protocol = custom
# upload_command = python pio/espupload.py -u $UPLOAD_PORT -f $SOURCE


[env:wthermostat-debug]
# higher speed for uploading to nodeMCU 
# also higher speed on Serial-Monitor (-DDEBUG sets Serial.speed(115200) )
board = nodemcuv2
monitor_speed = 115200
upload_speed = 921600